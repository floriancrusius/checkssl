version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      # Writes to stdout/stderr rarely fail meaningfully and there is no
      # sensible recovery — ignoring the return value keeps CLI code readable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write

formatters:
  enable:
    - gofmt
    - goimports
